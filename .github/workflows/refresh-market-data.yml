name: Refresh evidence from World Bank WDI
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - "scripts/refresh_data.py"
      - ".github/workflows/refresh-market-data.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve original WDI series and keep observed years
        run: python scripts/refresh_data.py
      - name: Commit only verified public-data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/market-data.json
          if git diff --cached --quiet; then
            echo "No dataset changes"
          else
            git commit -m "data: refresh verified World Bank indicator snapshot"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published official WDI snapshot"
                exit 0
              fi
              sleep 5
            done
            echo "Could not push WDI snapshot after rebasing"
            exit 1
          fi
