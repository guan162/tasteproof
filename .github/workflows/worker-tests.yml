name: Qloo adapter contract tests
on:
  push:
    paths:
      - "worker/**"
      - "tests/worker.test.mjs"
      - "wrangler.toml"
      - ".github/workflows/worker-tests.yml"
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/worker.test.mjs
